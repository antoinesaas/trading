# Lancement : docker compose up -d --build
# Avec un tunnel HTTPS public pour les webhooks TradingView :
#   docker compose --profile tunnel up -d --build
#   docker compose logs tunnel   (l'URL https://xxxx.trycloudflare.com y est affichée)
services:
  bot:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"   # jamais exposé directement sur Internet
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://bot:8000
    depends_on:
      - bot
    profiles: ["tunnel"]
    restart: unless-stopped
